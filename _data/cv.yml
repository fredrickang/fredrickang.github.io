    Projects:
      - name: "ZeroSwap: Minimizing Swap Overhead for Real-Time Multi-DNN Inference via SSD-based GPU Memory Extension"
        summary: >-
          A memory swapping framework that minimizes swap overhead for real-time
          multi-DNN inference on embedded systems with integrated GPUs.
        highlights:
          - Published in RTAS'26 (first author)
          - Semantic-aware selective swapping minimizes swap volume.
          - Shared pinned allocation eliminates runtime allocation overhead through physical memory sharing.
          - Segment-level overlapping hides PCIe transfer latency by overlapping swapping with computation.
          - Improved DNN task-set schedulability by up to 101.7% and response time by up to 3.2x over existing approaches.

      - name: "RT-Swap: Addressing GPU Memory Bottlenecks for Real-Time Multi-DNN Inference"
        summary: >-
          A real-time memory-management framework that extends GPU memory with
          CPU memory while preserving timing guarantees for multi-DNN inference.
        highlights:
          - Published in RTAS'24 (first author)
          - Improved task-set schedulability by at least 72% over existing approaches.
          - Supported task sets requiring up to 96.2% more memory than the GPU's physical capacity.

      - name: "DNN-SAM: Split-and-Merge DNN Execution for Real-Time Object Detection"
        summary: >-
          A split-and-merge execution and scheduling framework that provides
          different accuracy and timeliness levels to image regions with
          different criticality.
        highlights:
          - Published in RTAS'22 (first author)
          - Improved safety-critical-region detection accuracy by 2.0-3.7x.
          - Reduced average inference latency by 4.8-9.7x without violating timing constraints.

      - name: "LaLaRAND: Flexible Layer-by-Layer CPU/GPU Scheduling for Real-Time DNN Tasks"
        summary: >-
          A real-time layer-level DNN scheduling framework that combines
          CPU-friendly quantization with fine-grained CPU/GPU allocation.
        highlights:
          - Published in RTSS'21 (first author)
          - Improved schedulability by 56% over an existing approach and 80% over vanilla PyTorch.
          - Limited inference-accuracy difference to at most 0.4%.
